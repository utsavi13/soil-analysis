<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Soil Analysis System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>🌾 Soil Analysis System - Admin</h1>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Farmer Login</a>
            </nav>
        </header>

        <main class="form-container">
            <div class="form-card">
                <h2>🔐 Admin Login</h2>
                <p class="form-subtitle">Access admin dashboard</p>

                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="email">Admin Email</label>
                        <input type="email" id="email" name="email" required value="admin@soilanalysis.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div id="message" class="message"></div>

                    <button type="submit" class="btn btn-primary btn-block">Login as Admin</button>
                </form>

                <p class="form-footer">
                    Not an admin? <a href="login.html">Farmer Login</a>
                </p>
            </div>
        </main>
    </div>

    <script src="js/admin-login.js"></script>
</body>
</html>
